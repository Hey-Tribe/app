<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HeyTribe Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F8F6;--surface:#FFFFFF;--ink:#2F3B45;--muted:#606A73;--faint:#98A1A6;--line:#E1E6E1;
  --sage:#5E8C7A;--sage-ink:#46705F;--sage-soft:#E6EEE9;--deep:#3E5A55;
  --rose:#B08A84;--rose-soft:#F4E8E5;--blue:#6B8BA4;--blue-soft:#E4ECF2;--sand:#C9A86A;--sand-soft:#F5EEDF;--olive:#8A8F6B;--olive-soft:#EDEEE3;
  --good:#3F7D5C;--good-soft:#E3F1E8;--warn:#A86E12;--warn-soft:#FBF0DC;--bad:#B0463C;--bad-soft:#F8E4E1;
  --f-d:"Fraunces",Georgia,serif;--f-u:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-u);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--sage-ink)}
.tab{font-variant-numeric:tabular-nums}
/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 14px;font-size:18px}
.brand b{font-weight:800}.brand .tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px;margin-left:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.on{background:var(--ink);color:#fff}
.nav .n{margin-left:auto;font-size:12px;font-weight:700;background:var(--rose);color:#fff;border-radius:999px;padding:1px 7px}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.main{padding:28px 36px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-family:var(--f-d);font-weight:500;font-size:34px;margin:0;letter-spacing:-.4px}
h2{font-family:var(--f-d);font-weight:500;font-size:21px;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-d);font-size:34px;line-height:1.1;margin-top:6px}
.kpi .d{font-size:13px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;background:var(--ink);color:#fff;border:1.5px solid var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:default}
input.search,.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;outline:none}
input.search{max-width:320px;border-radius:999px;padding:9px 16px}
input:focus,select:focus,textarea:focus{border-color:var(--sage)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--bg)}
.tbl td.num,.tbl th.num{text-align:right}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-trialing{background:var(--blue-soft);color:#3E6382}.b-active{background:var(--good-soft);color:var(--good)}.b-past_due{background:var(--warn-soft);color:var(--warn)}
.b-canceled{background:var(--bad-soft);color:var(--bad)}.b-comped{background:var(--sand-soft);color:#7C5E1F}.b-free,.b-none{background:var(--bg);color:var(--muted)}.b-expired{background:var(--warn-soft);color:var(--warn)}
.b-new{background:var(--rose-soft);color:#8A5D57}.b-replied{background:var(--blue-soft);color:#3E6382}.b-done{background:var(--good-soft);color:var(--good)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:8px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:#6B4A10;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.banner b{color:#5A3D0A}
.banner.ok{background:var(--good-soft);color:#2F5A43}.banner.ok b{color:#234632}.banner a{color:inherit;font-weight:600}
.grid>*{min-width:0}
.err-msg{min-width:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:8px}.bars .r{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:10px;align-items:center;font-size:13.5px}.bars .t{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.bars .t i{display:block;height:100%;background:#5E8C7A;border-radius:999px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}.seg button{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--ink);color:#fff}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;border-radius:8px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.chart .tip b{font-weight:600}
/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}.li .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .t small{color:var(--muted)}
/* roadmap */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:#EEF2EF;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h3{margin:0 4px;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.rm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.rm:hover{border-color:var(--sage)}
.rm b{font-weight:600;line-height:1.3}
.rm .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.prio{display:inline-flex;gap:2px}.prio i{width:6px;height:6px;border-radius:50%;background:var(--line)}.prio i.on{background:var(--rose)}
.addcard{border:1.5px dashed #C9D3CC;border-radius:14px;padding:9px;color:var(--sage-ink);font-weight:600;text-align:center}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(20,26,29,.38);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;background:var(--surface);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;animation:slide .18s ease}
.scrim.center{justify-content:center;align-items:center;padding:20px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.dl dt{color:var(--muted)}.dl dd{margin:0}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counts div{background:var(--bg);border-radius:12px;padding:10px}.counts b{display:block;font-family:var(--f-d);font-size:22px;font-weight:500}.counts small{color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-size:14px}
/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin:0}
.msg-body{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font-size:14px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}
  .brand{width:100%;padding-bottom:6px}
  .nav{width:auto}
  .side .me{display:none}
  .main{padding:20px 16px 50px}
  .two{grid-template-columns:1fr}
}
</style>
</head><body>
<div id="root"></div>
<script src="/app/vendor/supabase.js"></script>
<script src="/app/config.js"></script>
<script src="/t.js" defer></script>
<script>
(function(){
"use strict";
const CFG = window.HEYTRIBE || {};
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce", storageKey: "ht-admin-auth" } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
const fmtD = d => d ? new Date(d).toLocaleDateString("en-US", { month:"short", day:"numeric", year: new Date(d).getFullYear() === new Date().getFullYear() ? undefined : "numeric" }) : "—";
const ago = d => { if(!d) return "—"; const s = (Date.now() - new Date(d)) / 1000; if(s < 3600) return Math.max(1, Math.round(s/60)) + "m ago"; if(s < 86400) return Math.round(s/3600) + "h ago"; if(s < 86400*30) return Math.round(s/86400) + "d ago"; return fmtD(d); };
const money = n => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const PRICE = 4.99;
const toast = t => { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); };
const ICON = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.5 4.6 4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>', card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
  map:'<path d="M9 4l6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/>', inbox:'<path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>', chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
};
const ico = (n, s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||""}</svg>`;
const mark = w => `<svg width="${w}" height="${Math.round(w*112/120)}" viewBox="0 0 120 112" aria-hidden="true"><path d="M30 0H90A30 30 0 0 1 120 30V58A30 30 0 0 1 90 88H46L22 110V88A22 24 0 0 1 0 64V30A30 30 0 0 1 30 0Z" fill="#5E8C7A"/><circle cx="35" cy="44" r="11" fill="#fff"/><circle cx="63" cy="44" r="11" fill="#fff"/><circle cx="88" cy="49" r="7" fill="#fff"/></svg>`;
const ST = { stats:null, view: (location.hash.slice(1) || "overview"), me:null };
const VIEWS = [["overview","Overview","home"],["traffic","Traffic","chart"],["families","Families","users"],["people","People","user"],["billing","Billing","card"],["roadmap","Roadmap","map"],["inbox","Inbox","inbox"],["errors","Errors","alert"],["settings","Settings","gear"]];
let BILLING_ON = null;
async function billingOn(){ if(BILLING_ON === null){ try { BILLING_ON = !!(await (await fetch("/api/billing", { cache: "no-store" })).json()).enabled; } catch(e){ BILLING_ON = false; } } return BILLING_ON; }
const STATUS_LABEL = { trialing:"Trial", active:"Paying", past_due:"Past due", canceled:"Canceled", comped:"Comped", free:"Free", none:"No plan", expired:"Trial ended" };
function planOf(t){ if(!t.status) return "none"; if(t.status === "trialing" && t.trial_ends_at && new Date(t.trial_ends_at) < new Date()) return "expired"; return t.status; }
const badge = s => `<span class="badge b-${s}">${STATUS_LABEL[s] || s}</span>`;
async function rpc(name, args){ const r = await sb.rpc(name, args || {}); if(r.error) throw r.error; return r.data; }

/* ---------- login ---------- */
function loginView(mode, msg){
  mode = mode || "in";
  $("#root").innerHTML = `<div class="login"><form class="box card" id="lf" style="padding:28px">
    <div class="row" style="gap:8px;font-size:19px">${mark(26)}<span>hey<b style="font-weight:800">tribe</b></span><span class="pill" style="margin-left:auto">Admin</span></div>
    <h1 style="font-size:28px">${mode === "up" ? "Create your admin login" : mode === "reset" ? "Reset your password" : "Sign in"}</h1>
    ${msg ? `<p class="sub" style="margin:0">${esc(msg)}</p>` : ""}
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>
    ${mode !== "reset" ? `<div class="field"><label for="pw">Password</label><input id="pw" type="password" minlength="8" autocomplete="${mode === "up" ? "new-password" : "current-password"}" required></div>` : ""}
    <button class="btn" style="justify-content:center">${mode === "up" ? "Create login" : mode === "reset" ? "Send reset link" : "Sign in"}</button>
    <p class="err" id="le"></p>
    <div class="between" style="font-size:13.5px">
      ${mode === "in" ? `<button type="button" data-m="reset" style="color:var(--sage-ink);font-weight:600">Forgot password?</button><button type="button" data-m="up" style="color:var(--sage-ink);font-weight:600">First time? Create your login</button>` : `<button type="button" data-m="in" style="color:var(--sage-ink);font-weight:600">Back to sign in</button>`}
    </div>
    <p class="sub" style="font-size:12.5px;margin:0">Only approved admin emails can open this site.</p>
  </form></div>`;
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => loginView(b.dataset.m));
  $("#lf").onsubmit = async e => {
    e.preventDefault(); const em = $("#em").value.trim(), pw = $("#pw")?.value, er = $("#le"); er.textContent = "";
    try {
      if(mode === "up"){ const r = await sb.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: location.origin + "/" } }); if(r.error) throw r.error; if(!r.data.session) loginView("in", "Check your email for a confirmation link, then sign in."); }
      else if(mode === "reset"){ const r = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + "/" }); if(r.error) throw r.error; loginView("in", "If that email has a login, a reset link is on its way."); }
      else { const r = await sb.auth.signInWithPassword({ email: em, password: pw }); if(r.error) throw r.error; }
    } catch(x){ er.textContent = /invalid login/i.test(x.message||"") ? "That email and password don't match." : /not confirmed/i.test(x.message||"") ? "Confirm your email first, then sign in." : (x.message || "Something went wrong."); }
  };
}
function newPasswordView(){
  $("#root").innerHTML = `<div class="login"><form class="box card" id="np" style="padding:28px"><h1 style="font-size:28px">Choose a new password</h1>
    <div class="field"><label for="pw">New password</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="btn" style="justify-content:center">Save</button><p class="err" id="le"></p></form></div>`;
  $("#np").onsubmit = async e => { e.preventDefault(); const r = await sb.auth.updateUser({ password: $("#pw").value }); if(r.error) $("#le").textContent = r.error.message; else { toast("Password saved"); boot(); } };
}
function deniedView(email){
  $("#root").innerHTML = `<div class="login"><div class="box card" style="padding:28px"><h1 style="font-size:28px">No admin access</h1>
    <p class="sub">${esc(email)} isn't on the admin list. Sign in with an approved admin email.</p>
    <button class="btn ghost" id="so" style="align-self:flex-start">Sign out</button></div></div>`;
  $("#so").onclick = () => sb.auth.signOut();
}

/* ---------- shell ---------- */
function shell(){
  const n = ST.stats?.inbox_new || 0;
  $("#root").innerHTML = `<div class="shell"><aside class="side">
    <div class="brand">${mark(24)}<span>hey<b>tribe</b></span><span class="tag">Admin</span></div>
    ${VIEWS.map(([v,l,i]) => `<button class="nav ${ST.view===v?"on":""}" data-v="${v}">${ico(i)}<span>${l}</span>${v==="inbox"&&n?`<span class="n">${n}</span>`:""}${v==="errors"&&ST.stats?.errors_24h?`<span class="n">${ST.stats.errors_24h}</span>`:""}</button>`).join("")}
    <div class="me"><span>${esc(ST.me?.email||"")}</span><a href="https://www.heytribe.app/app/" target="_blank" rel="noopener">Open the app</a><button style="text-align:left;color:var(--sage-ink);font-weight:600" id="so">Sign out</button></div>
  </aside><main class="main" id="main"><div class="empty">Loading…</div></main></div>`;
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
  $("#so").onclick = () => sb.auth.signOut();
}
function go(v){ ST.view = v; history.replaceState(null, "", "#" + v); shell(); render(); }
async function render(){
  const m = $("#main"); if(!m) return;
  try { await ({ overview, traffic, families, people, billing, roadmap, inbox, errors, settings })[ST.view](m); }
  catch(x){ m.innerHTML = `<div class="card"><h2>Couldn't load this page</h2><p class="sub">${esc(x.message || x)}</p></div>`; }
}

/* ---------- overview ---------- */
async function overview(m){
  const [s, daily, tribes, road] = await Promise.all([rpc("admin_stats"), rpc("admin_daily", { p_days: 30 }), rpc("admin_tribes", { p_q:"", p_limit:200, p_offset:0 }), sb.from("roadmap_items").select("*").eq("area","launch").neq("status","shipped").order("priority")]);
  ST.stats = s;
  const mrr = s.active * PRICE;
  const soon = (tribes||[]).filter(t => t.status === "trialing" && t.trial_ends_at && new Date(t.trial_ends_at) > new Date() && new Date(t.trial_ends_at) - new Date() < 3*864e5);
  const kpi = (l, v, d) => `<div class="card kpi"><div class="l">${l}</div><div class="v tab">${v}</div><div class="d">${d}</div></div>`;
  m.innerHTML = `<div class="head"><div><h1>Overview</h1><p class="sub">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</p></div><button class="btn ghost sm" id="rf">Refresh</button></div>
    ${s.errors_24h ? `<div class="banner"><span>⚠</span><div><b>${s.errors_24h} error report${s.errors_24h==1?"":"s"} in the last 24 hours.</b> <a href="#errors" data-goto="errors">See what's breaking</a></div></div>` : ""}
    <div class="grid kpis">
      ${kpi("Visitors", s.visitors_7d ?? 0, "on the website and app, 7 days")}

/* one series, one hue, rounded tops on a shared baseline, hover tooltip per bar */
function barChart(el, rows, o){
  const K = o.key, W = 640, H = 200, P = { l: 34, r: 6, t: 8, b: 24 }, n = rows.length, max = Math.max(4, ...rows.map(r => Number(r[K])));
  const step = Math.ceil(max / 4), top = step * 4, bw = (W - P.l - P.r) / n, gap = 2, y = v => P.t + (H - P.t - P.b) * (1 - v / top);
  let g = "";
  for(let i = 0; i <= 4; i++){ const v = step * i, yy = y(v); g += `<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#E1E6E1" stroke-width="1"/><text x="${P.l-8}" y="${yy+4}" font-size="11" fill="#98A1A6" text-anchor="end">${v}</text>`; }
  rows.forEach((r, i) => {
    const v = Number(r[K]), x = P.l + i * bw + gap / 2, w = bw - gap, h = Math.max(0, y(0) - y(v));
    if(h > 0){ const rr = Math.min(4, w / 2, h); g += `<path d="M${x},${y(0)} V${y(v)+rr} Q${x},${y(v)} ${x+rr},${y(v)} H${x+w-rr} Q${x+w},${y(v)} ${x+w},${y(v)+rr} V${y(0)} Z" fill="#5E8C7A"/>`; }
    g += `<rect x="${P.l + i*bw}" y="${P.t}" width="${bw}" height="${H-P.t-P.b}" fill="transparent" data-i="${i}"/>`;
    if(i % Math.max(1, Math.round(n / 6)) === 0 || i === n - 1) g += `<text x="${x + w/2}" y="${H-6}" font-size="11" fill="#98A1A6" text-anchor="middle">${new Date(r.day + "T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">${g}<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" stroke="#C9D3CC"/></svg><div class="tip"></div>
    <details style="margin-top:8px"><summary class="sub" style="cursor:pointer;font-size:12.5px">Show as a table</summary><table class="tbl" style="margin-top:6px"><tr><th>Day</th>${o.head.map(h => `<th class="num">${h}</th>`).join("")}</tr>${rows.slice().reverse().map(r => `<tr><td>${fmtD(r.day+"T00:00:00")}</td>${o.cells(r).map(c => `<td class="num tab">${c}</td>`).join("")}</tr>`).join("")}</table></details>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.querySelectorAll("rect[data-i]").forEach(rc => {
    rc.addEventListener("mouseenter", () => { const r = rows[+rc.dataset.i], b = rc.getBoundingClientRect(), o = el.getBoundingClientRect();
      tip.innerHTML = `<b>${new Date(r.day+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</b> · ${o.tip(r)}`;
      tip.style.left = (b.left - o.left + b.width/2) + "px"; tip.style.top = (y(Number(r[K])) / H * svg.getBoundingClientRect().height) + "px"; tip.style.opacity = 1; });
    rc.addEventListener("mouseleave", () => tip.style.opacity = 0);
  });
}

      <li>In Stripe, create a product “HeyTribe Premium” with a $4.99 monthly price. Copy the price id (price_…).</li>
      <li>In Stripe → Developers → Webhooks, add <b>https://www.heytribe.app/api/stripe-webhook</b> with the events checkout.session.completed and customer.subscription.created, .updated and .deleted. Copy the signing secret (whsec_…).</li>
      <li>In Vercel → heytribe → Settings → Environment Variables, add STRIPE_SECRET_KEY, STRIPE_PRICE_ID and STRIPE_WEBHOOK_SECRET, then redeploy.</li>
      <li>In Stripe → Settings → Billing → Customer portal, turn on cancel and update payment method.</li></ol></div>`;
}

/* ---------- traffic ---------- */
async function traffic(m){
  const days = ST.tDays || 30;
  const t = await rpc("admin_traffic", { p_days: days });
  const kpi = (l, v, d) => `<div class="card kpi"><div class="l">${l}</div><div class="v tab">${v}</div><div class="d">${d}</div></div>`;
  const signups = t.sources.reduce((a, x) => a + Number(x.signups), 0);
  const maxSrc = Math.max(1, ...t.sources.map(x => Number(x.visitors))), maxPg = Math.max(1, ...t.pages.map(x => Number(x.views)));
  const devs = Object.entries(t.devices || {}), devTotal = devs.reduce((a, [,n]) => a + Number(n), 0) || 1;
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
  m.innerHTML = `<div class="head"><div><h1>Traffic</h1><p class="sub">Visits to the website and app. No cookies or personal details, just a random id per browser.</p></div>
      <div class="seg">${[[7,"7 days"],[30,"30 days"],[90,"90 days"]].map(([d,l]) => `<button class="${days===d?"on":""}" data-d="${d}">${l}</button>`).join("")}</div></div>
    <div class="grid kpis">
      ${kpi("Visitors", t.visitors, `${t.views} page views`)}
      ${kpi("Opened the app", t.app_opens, `${pct(t.app_opens, t.visitors)} of visitors`)}
      ${kpi("New families", signups, `${pct(signups, t.visitors)} of visitors`)}
    </div>
    <div class="card" style="margin-top:16px"><div class="between"><h2>Visitors per day</h2></div><div class="chart" id="tch" style="margin-top:14px"></div></div>
    <div class="grid two">
      <div class="card"><h2>Where they came from</h2><p class="sub" style="font-size:13px">Add <b>?utm_source=instagram</b> (or any name) to links you share to see them here.</p>
        ${t.sources.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Source</th><th class="num">Visitors</th><th class="num">New families</th><th class="num">Rate</th></tr></thead><tbody>${t.sources.map(x => `<tr><td>${x.src==="unknown"?`<span class="sub">not tracked</span>`:esc(x.src)}</td><td class="num tab">${x.visitors}</td><td class="num tab">${x.signups}</td><td class="num tab">${pct(x.signups, x.visitors)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">No visits yet.</div>`}</div>
      <div class="card"><h2>Top pages</h2>${t.pages.length ? `<div class="bars" style="margin-top:12px">${t.pages.map(x => `<div class="r"><span style="overflow-wrap:anywhere">${esc(x.path)}</span><span class="t"><i style="width:${Math.max(3, x.views / maxPg * 100)}%"></i></span><span class="tab">${x.views}</span></div>`).join("")}</div>` : `<div class="empty">No visits yet.</div>`}
        ${devs.length ? `<h2 style="margin-top:20px">Devices</h2><div class="bars" style="margin-top:12px">${devs.sort((a,b)=>b[1]-a[1]).map(([d,n]) => `<div class="r"><span style="text-transform:capitalize">${esc(d)}</span><span class="t"><i style="width:${Math.max(3, n / devTotal * 100)}%"></i></span><span class="tab">${pct(n, devTotal)}</span></div>`).join("")}</div>` : ""}</div>
    </div>`;
  barChart($("#tch"), t.daily, { key: "visitors", aria: `Daily visitors for the last ${days} days`, tip: r => `${r.visitors} visitor${r.visitors==1?"":"s"} · ${r.views} page view${r.views==1?"":"s"}`, head: ["Visitors","Page views"], cells: r => [r.visitors, r.views] });
  m.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { ST.tDays = +b.dataset.d; render(); });
}

/* ---------- errors ---------- */
async function errors(m){
  const rows = await rpc("admin_errors", { p_days: 7 });
  const where = { site: "Website", app: "App", admin: "Admin" };
  const browser = ua => !ua ? "" : /iPhone|iPad/.test(ua) ? "iPhone/iPad" : /Android/.test(ua) ? "Android" : /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Other";
  m.innerHTML = `<div class="head"><div><h1>Errors</h1><p class="sub">Problems families' browsers ran into in the last 7 days, grouped by message. Most come and go with bad connections; a number that keeps climbing is worth fixing.</p></div><button class="btn ghost sm" id="rf">Refresh</button></div>
    ${rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Message</th><th>Where</th><th class="num">Times</th><th class="num">People</th><th>Last seen</th><th>Browser</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><div class="err-msg">${esc(r.message)}</div>${r.source ? `<small class="sub">${esc(r.source.replace(/^https?:\/\/[^/]+/, ""))}${r.line ? ":" + r.line : ""}</small>` : ""}</td><td>${where[r.area] || esc(r.area)}<br><small class="sub">${esc(r.path || "")}</small></td><td class="num tab">${r.n}</td><td class="num tab">${r.visitors}</td><td>${ago(r.last_at)}</td><td>${browser(r.ua)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty">No errors in the last 7 days.</div>`}`;
  $("#rf").onclick = () => render();
}

/* ---------- boot ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  if(!data.session) return loginView("in");
  try {
    const w = await rpc("admin_whoami");
    if(!w.admin) return deniedView(data.session.user.email);
    ST.me = w; ST.stats = await rpc("admin_stats").catch(() => null);
    if(!VIEWS.some(v => v[0] === ST.view)) ST.view = "overview";
    shell(); render();
  } catch(x){ $("#root").innerHTML = `<div class="login"><div class="box card"><h1 style="font-size:26px">Can't reach the database</h1><p class="sub">${esc(x.message||x)}</p><button class="btn ghost" onclick="location.reload()">Try again</button></div></div>`; }
}
sb.auth.onAuthStateChange((ev) => { if(ev === "PASSWORD_RECOVERY") newPasswordView(); else if(ev === "SIGNED_IN" || ev === "SIGNED_OUT") boot(); });
boot();
})();
</script>
