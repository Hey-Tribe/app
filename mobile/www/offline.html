<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HeyTribe</title>
<style>
html,body{margin:0;height:100%;background:#FBFCFA;color:#2F3B45;font-family:-apple-system,system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}
.mark{width:64px;height:58px;border-radius:18px;background:#5E8C7A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:2px}
h1{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:6px 0 0}
p{margin:0;color:#606A73;font-size:16px;line-height:1.5;max-width:30ch}
button{margin-top:10px;background:#2F3B45;color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:600}
</style></head>
<body><main><div class="mark">•••</div><h1 id="t">Can't reach HeyTribe</h1><p id="d">Check your Wi-Fi or cell signal, then try again.</p><button id="b" onclick="location.href='https://www.heytribe.app/app/'">Try again</button></main>
<script>if((navigator.language||"").slice(0,2)==="es"){t.textContent="No podemos conectar con HeyTribe";d.textContent="Revisa tu Wi-Fi o señal y vuelve a intentarlo.";b.textContent="Intentar de nuevo";}</script></body></html>
