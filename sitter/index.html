<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Care sheet | HeyTribe</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFCFA;--surface:#fff;--ink:#2F3B45;--muted:#606A73;--line:#E1E6E1;--sage:#5E8C7A;--sage-ink:#46705F;--sage-soft:#E6EEE9;--rose-ink:#8E6A64;
--m-sage:#5E8C7A;--m-sage-bg:#D7E5DC;--m-blue:#6B8BA4;--m-blue-bg:#D9E3EB;--m-rose:#B08A84;--m-rose-bg:#EFE0DC;--m-olive:#8A8F6B;--m-olive-bg:#E6E8D7;--m-sand:#C9A66B;--m-sand-bg:#F1E7D3;
--f-ui:"Outfit",system-ui,sans-serif;--f-display:"Fraunces",Georgia,serif;--f-hand:"Caveat",cursive}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:24px 20px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:8px;font-size:19px;text-decoration:none;color:inherit}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,8vw,52px);letter-spacing:-1px;line-height:1.05;margin:22px 0 6px}h1 em{color:var(--sage-ink)}
.sub{color:var(--muted);margin:0}.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}
.kid{display:flex;align-items:center;gap:12px}.kid h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.face{display:inline-flex;border-radius:50%;overflow:hidden;flex-shrink:0}
.allergy{background:var(--m-rose-bg);border-radius:14px;padding:10px 12px;margin-top:12px;color:var(--rose-ink)}.allergy b{font-weight:600}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row b{font-weight:600}.row small{display:block;color:var(--muted);font-size:13.5px}
.call{margin-left:auto;align-self:center;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;text-decoration:none;font-size:14px;white-space:nowrap}
.info dt{font-size:11.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-top:12px}.info dd{margin:2px 0 0;white-space:pre-line}
.empty{text-align:center;padding:60px 10px}.hand{font-family:var(--f-hand);font-size:26px;color:var(--sage-ink)}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--muted)}.foot a{color:var(--sage-ink);font-weight:600}
@media print{.call,.foot{display:none}.card{break-inside:avoid}}
</style></head>
<body><main id="m"><p class="sub">Loading…</p></main>
<script src="/app/config.js"></script>
<script>
(function(){
"use strict";
const CFG = window.HEYTRIBE || {}, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["sage","blue","rose","olive","sand"], okColor = c => COLORS.includes(c) ? c : "sage";
const SKINS = ["#F1C9A5","#E2B48C","#D9A27A","#C98E66","#9C6B4A","#6E4A33"], HAIRS = ["#1C1A1A","#3B2A22","#6E4A30","#8A6142","#C9A15E","#9A9A9A"];
const okHex = (c, f) => /^#[0-9a-fA-F]{6}$/.test(String(c)) ? c : f;
const fmtT = hhmm => { const [h0, m] = String(hhmm||"").split(":").map(Number); if(isNaN(h0)) return ""; const ap = h0 >= 12 ? "pm" : "am", h = h0 % 12 || 12; return h + (m ? ":" + String(m).padStart(2,"0") : "") + ap; };
function face(m, size=36){
  if(!m) return `<span class="face" style="width:${size}px;height:${size}px;background:var(--line)"></span>`;
  const s = ["short","long","kid","baby"].includes(m.style) ? m.style : "short";
  const small = s==="kid" || s==="baby", hr = small?9.5:10, hy = small?22:21;
  const skin = okHex(m.skin, SKINS[1]), hair = okHex(m.hair, HAIRS[1]), c = okColor(m.color);
  const hp = {
    short:`<path d="M9.8 20.5 Q9.6 9.5 20 9.6 Q30.4 9.5 30.2 20.5 Q28.5 14.2 21 14.6 Q15 13.8 12.5 17 Q11 18.4 9.8 20.5Z" fill="${hair}"/>`,
    long:`<circle cx="20" cy="8.6" r="4.6" fill="${hair}"/><path d="M9.6 25 Q8.6 10.6 20 10.8 Q31.4 10.6 30.4 25 Q29.4 15.8 20 15.2 Q12.6 15.4 9.6 25Z" fill="${hair}"/>`,
    kid:`<path d="M10.6 20.5 Q10.2 12 20 11.8 Q29.8 12 29.4 20.5 L27 16.2 L24.4 18 L22 14.8 L19 17.6 L16.2 15 L13.6 17.8Z" fill="${hair}"/>`,
    baby:`<path d="M19 13.2 q1.4 -4.4 4.6 -2.6 q-2.6 0.2 -2.4 3" fill="none" stroke="${hair}" stroke-width="1.6" stroke-linecap="round"/>`
  }[s];
  return `<span class="face" style="width:${size}px;height:${size}px" title="${esc(m.name)}"><svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" style="fill:var(--m-${c}-bg)"/><path d="M7 41 Q8 31 20 31 Q32 31 33 41Z" style="fill:var(--m-${c})"/><circle cx="20" cy="${hy}" r="${hr}" fill="${skin}"/>${hp}<circle cx="14.6" cy="${hy+3.6}" r="1.6" fill="#E59A8A" opacity=".45"/><circle cx="25.4" cy="${hy+3.6}" r="1.6" fill="#E59A8A" opacity=".45"/><circle cx="16.6" cy="${hy+.6}" r="1.15" fill="#2F3B45"/><circle cx="23.4" cy="${hy+.6}" r="1.15" fill="#2F3B45"/><path d="M17.6 ${hy+4.2} Q20 ${hy+6.2} 22.4 ${hy+4.2}" fill="none" stroke="#2F3B45" stroke-width="1.1" stroke-linecap="round"/></svg></span>`;
}
const ico = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const PILL = '<path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/><path d="M7 7l7 7"/>', MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', PHONE = '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>';
const logo = `<a class="logo" href="/"><svg width="26" height="24" viewBox="0 0 120 112" aria-hidden="true"><path d="M30 0H90A30 30 0 0 1 120 30V58A30 30 0 0 1 90 88H46L22 110V88A22 24 0 0 1 0 64V30A30 30 0 0 1 30 0Z" fill="#5E8C7A"/><circle cx="35" cy="44" r="11" fill="#fff"/><circle cx="63" cy="44" r="11" fill="#fff"/><circle cx="88" cy="49" r="7" fill="#fff"/></svg><span>hey<b style="font-weight:800">tribe</b></span></a>`;
const t = new URLSearchParams(location.search).get("t") || "";
fetch(CFG.supabaseUrl + "/rest/v1/rpc/sitter_sheet", { method: "POST", headers: { apikey: CFG.supabaseAnonKey, authorization: "Bearer " + CFG.supabaseAnonKey, "content-type": "application/json" }, body: JSON.stringify({ p_token: t }) })
  .then(r => r.ok ? r.json() : null).then(d => {
    if(!d){ $("#m").innerHTML = `<div class="top">${logo}</div><div class="empty"><p class="hand">this link has ended</p><p class="sub">Ask the family for a new sitter link.</p></div>`; return; }
    const kids = (d.members || []).filter(m => m.style === "kid" || m.style === "baby").sort((a,b) => (a.order ?? 99) - (b.order ?? 99));
    const until = new Date(d.expires_at).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    const kidCard = m => {
      const al = (d.allergies || []).filter(a => a.member === m.id), meds = (d.meds || []).filter(x => x.member === m.id && (!x.until || x.until >= new Date().toISOString().slice(0,10)));
      const bed = (d.routines || []).filter(r => r.member === m.id && /bed|night|sleep|nap/i.test(r.name || ""));
      return `<section class="card"><div class="kid">${face(m, 48)}<h2>${esc(m.name)}</h2></div>
        ${al.length ? `<div class="allergy"><b>Allergic to:</b> ${al.map(a => esc(a.title)).join(", ")}${al.some(a => a.note) ? `<br><span style="font-size:14px">${al.map(a => esc(a.note || "")).filter(Boolean).join(" · ")}</span>` : ""}</div>` : ""}
        ${meds.map(x => `<div class="row"><span class="ic" style="background:var(--m-blue-bg);color:var(--m-blue)">${ico(PILL)}</span><span><b>${esc(x.name)}${x.dose ? " · " + esc(x.dose) : ""}</b><small>${(x.times || []).map(fmtT).join(", ")}${x.note ? " · " + esc(x.note) : ""}</small></span></div>`).join("")}
        ${bed.map(r => `<div class="row"><span class="ic" style="background:var(--m-olive-bg);color:var(--m-olive)">${ico(MOON)}</span><span><b>${esc(r.name)}${r.time ? " at " + fmtT(r.time) : ""}</b><small>${(r.steps || []).map(s => esc(s.text)).join(" → ")}</small></span></div>`).join("")}
        ${!al.length && !meds.length && !bed.length ? `<p class="sub" style="margin-top:10px">No allergies, medicine or bedtime routine listed.</p>` : ""}</section>`;
    };
    const order = { emergency: 0, doctor: 1, family: 2, sitter: 3 };
    const contacts = (d.contacts || []).slice().sort((a,b) => (order[a.role] ?? 9) - (order[b.role] ?? 9));
    const i = d.info || {};
    $("#m").innerHTML = `<div class="top">${logo}<button onclick="print()" style="border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer">Print</button></div>
      <h1>Care sheet for <em>${esc(d.tribe)}</em></h1><p class="sub">Shared by the family. This link works until ${esc(until)}.</p>
      ${kids.map(kidCard).join("") || `<section class="card"><p class="sub">No kids listed yet.</p></section>`}
      ${contacts.length ? `<section class="card"><span class="eyebrow">Who to call</span>${contacts.map(c => `<div class="row"><span class="ic" style="background:var(--sage-soft);color:var(--sage-ink)">${ico(PHONE)}</span><span><b>${esc(c.name)}</b><small>${esc(c.note || ({emergency:"Emergency", doctor:"Doctor", family:"Family", sitter:"Sitter"})[c.role] || "")}</small></span>${c.phone ? `<a class="call" href="tel:${esc(String(c.phone).replace(/[^0-9+]/g, ""))}">${esc(c.phone)}</a>` : ""}</div>`).join("")}<div class="row"><span class="ic" style="background:var(--m-rose-bg);color:var(--rose-ink)">${ico(PHONE)}</span><span><b>Emergency</b><small>Police, fire, ambulance</small></span><a class="call" href="tel:911">911</a></div></section>` : ""}
      ${i.address || i.wifi || i.rules || i.notes ? `<section class="card info"><span class="eyebrow">The house</span><dl>${[["Address", i.address], ["Wi-Fi", i.wifi], ["House rules", i.rules], ["Good to know", i.notes]].filter(x => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>` : ""}
      <p class="foot">Made with <a href="/">HeyTribe</a>, the calm family planner.</p>`;
    document.title = "Care sheet for " + d.tribe + " | HeyTribe";
  }).catch(() => { $("#m").innerHTML = `<div class="top">${logo}</div><div class="empty"><p class="hand">can't load right now</p><p class="sub">Check your connection and refresh.</p></div>`; });
})();
</script></body></html>
