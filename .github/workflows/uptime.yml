# Uptime monitor: checks the site, app, server, database, help and contact pages, sitter page, admin and app-link files
# every 5 minutes (GitHub sometimes runs scheduled jobs a few minutes late).
# When something goes down it opens a GitHub issue labeled "outage" (GitHub emails everyone watching the repo) and asks
# /api/uptime-alert to email the admins through Resend. That endpoint re-checks from the server before emailing.
# When everything is back up it comments, closes the issue and asks for an all-clear email.
# Manual run: GitHub › Actions › "Uptime" › Run workflow.
name: Uptime
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/uptime.yml", "tools/uptime-check.mjs", "api/_uptime.js"]
permissions:
  issues: write
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/uptime-check.mjs
            api/_uptime.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every page and service
        id: check
        continue-on-error: true
        run: node tools/uptime-check.mjs
      - name: Open or close the outage issue and email
        uses: actions/github-script@v7
        env:
          DOWN: ${{ steps.check.outputs.down }}
          REPORT: ${{ steps.check.outputs.report }}
          FAILED: ${{ steps.check.outcome == 'failure' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const down = process.env.FAILED === "true";
            const what = process.env.DOWN || "a check";
            const report = process.env.REPORT || "The check itself failed. Open the run for details.";
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString().replace("T", " ").slice(0, 16) + " UTC";
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "outage", per_page: 1 })).data[0];
            async function email(state) {
              try {
                const r = await fetch("https://www.heytribe.app/api/uptime-alert", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ state }), signal: AbortSignal.timeout(60000) });
                core.info(`Alert email: ${r.status} ${await r.text()}`);
              } catch (e) { core.warning(`Alert email not sent: ${e.message}`); }
            }
            if (down && !open) {
              try { await github.rest.issues.createLabel({ owner, repo, name: "outage", color: "d73a4a", description: "Opened by the uptime monitor" }); } catch (e) {}
              const issue = await github.rest.issues.create({ owner, repo, labels: ["outage"],
                title: `Down: ${what}`,
                body: `The uptime monitor found a problem at ${now}.\n\n${report}\n\nWhat to check first: https://www.heytribe.app/api/health, Vercel status, Supabase status. Rollback steps are in docs/OPERATIONS.md section 5.\n\nRun: ${run}\n\nThis issue closes by itself when everything is back up.` });
              await email("down");
            } else if (down && open) {
              core.info(`Still down, issue #${open.number} is open`);
            } else if (!down && open) {
              const mins = Math.round((Date.now() - new Date(open.created_at)) / 60000);
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Everything is back up as of ${now} (about ${mins} minutes after this opened). Run: ${run}` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: "closed", state_reason: "completed" });
              await email("up");
            } else {
              core.info("All up");
            }
