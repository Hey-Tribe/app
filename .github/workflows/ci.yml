# Runs on every push and pull request: the built app matches its source, server tests pass,
# a real browser clicks through the site and the sample family, and the database tests pass.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Built app matches source
        run: npm run build:app && git diff --exit-code -- app/index.html app/sw.js app/assets
      - name: Server tests
        run: npm test
      - name: Browser smoke test
        run: npx playwright install --with-deps chromium && npm run test:e2e

  # Database: start a fresh local Supabase from supabase/migrations, run the row level security tests,
  # and check the committed types (supabase/types.ts) match. With the SUPABASE_ACCESS_TOKEN secret it also
  # checks the types against production, which catches changes made to production but not saved as a migration.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start a local database from the migrations
        run: supabase db start
      - name: Row level security tests
        run: supabase test db
      - name: Generated types match the migrations
        run: supabase gen types typescript --local --schema public > /tmp/types.ts && diff -u supabase/types.ts /tmp/types.ts
      - name: Generated types match production
        if: env.HAS_TOKEN == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase gen types typescript --project-id ayafbypcbsfmqckuwqom --schema public > /tmp/live.ts && diff -u supabase/types.ts /tmp/live.ts
